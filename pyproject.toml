[project]
name = "codeagent"
version = "0.1.0"
description = "类 Claude Code 的本地代码辅助 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "croniter>=2.0",
    "mcp>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
codeagent = "codeagent.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeagent*", "baseagent*"]
